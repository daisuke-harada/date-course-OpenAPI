components:
  schemas:
    DateSpotFormRequestData:
      type: object
      required:
        - name
        - genre_id
        - opening_time
        - closing_time
        - image
        - prefecture_id
        - city_name
      properties:
        name:
          type: string
        genre_id:
          type: integer
        opening_time:
          type: string
          format: date-time
        closing_time:
          type: string
          format: date-time
        image:
          $ref: "./image.yaml#/components/schemas/ImageData"
        prefecture_id:
          type: integer
        city_name:
          type: string

